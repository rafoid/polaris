services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: polaris123
      POSTGRES_DB: polaris
    volumes:
      # Persistent storage for PostgreSQL data on host
      - ../../data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris"]
      interval: 2s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    ports:
      # API port
      - "9000:9000"
      # UI port
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_root
      MINIO_ROOT_PASSWORD: m1n1opwd
    volumes:
      # Persistent storage for MinIO data on host
      - ../../data/minio:/data
    command:
      - "server"
      - "/data"
      - "--console-address"
      - ":9001"
    healthcheck:
      test: ["CMD", "curl", "http://127.0.0.1:9000/minio/health/live"]
      interval: 1s
      timeout: 10s

  polaris-bootstrap:
    image: apache/polaris-admin-tool:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: polaris123
      QUARKUS_DATASOURCE_DB_KIND: postgresql
    command:
      - bootstrap
      - -r
      - POLARIS
      - -c
      - POLARIS,root,s3cr3t

  polaris:
    image: apache/polaris:latest
    ports:
      # API port
      - "8181:8181"
      # Optional, allows attaching a debugger to the Polaris JVM
      - "5006:5005"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      JAVA_DEBUG: "true"
      JAVA_DEBUG_PORT: "*:5005"
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: minio_root
      AWS_SECRET_ACCESS_KEY: m1n1opwd
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
      polaris.realm-context.realms: POLARIS
      quarkus.otel.sdk.disabled: "true"

      # ================== VERIFY WE NEED THESE ==================
      # Not all of these config params might be needed. All these
      # were added to enable DROP TABLE from 3rd party clients like
      # Netezza. Test to determine the smallest possible set.
      # ==========================================================
      # Enable data deletion on DROP TABLE with PURGE
      polaris.features."DROP_WITH_PURGE_ENABLED": "true"
      # Optional: Enable cleanup when dropping catalogs (not just tables)
      polaris.features."CLEANUP_ON_CATALOG_DROP": "false"
      # Task executor configuration for async cleanup tasks
      polaris.tasks.max-concurrent-tasks: "10"
      polaris.tasks.max-queued-tasks: "100"
      # FIX: Use remote-signing to avoid RequestScoped context issues in async tasks
      # This makes Polaris use its own AWS credentials for cleanup tasks
      polaris.catalog.default-access-delegation-mode: "remote-signing"
      # ==========================================================

      # PostgreSQL persistence configuration - THIS IS THE KEY!
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polaris
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: polaris123
      QUARKUS_DATASOURCE_DB_KIND: postgresql

    healthcheck:
      test: ["CMD", "curl", "http://localhost:8182/q/health"]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 10s

  setup_bucket:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: "/bin/sh"
    command:
      - "-c"
      - >-
        echo Creating MinIO bucket...;
        mc alias set pol http://minio:9000 minio_root m1n1opwd;
        mc mb pol/bucket123;
        mc ls pol;
        echo Bucket setup complete.;

  polaris-setup:
    image: alpine/curl
    depends_on:
      polaris:
        condition: service_healthy
    environment:
      - CLIENT_ID=root
      - CLIENT_SECRET=s3cr3t
    volumes:
      - ../../data/polaris/:/polaris
    entrypoint: "/bin/sh"
    command:
      - "-c"
      - >-
        chmod +x /polaris/create-catalog.sh;
        chmod +x /polaris/obtain-token.sh;
        source /polaris/obtain-token.sh;
        echo Creating catalog...;
        export STORAGE_CONFIG_INFO='{"storageType":"S3",
          "endpoint":"http://9.30.117.69:9000",
          "endpointInternal":"http://9.30.117.69:9000",
          "pathStyleAccess":true,
          "allowedLocations":["s3://bucket123","s3://bucket123/*"]}';
        export STORAGE_LOCATION='s3://bucket123';
        /polaris/create-catalog.sh POLARIS $$TOKEN;
        echo Extra grants...;
        curl -H "Authorization: Bearer $$TOKEN" -H 'Content-Type: application/json' \
          -X PUT \
          http://polaris:8181/api/management/v1/catalogs/quickstart_catalog/catalog-roles/catalog_admin/grants \
          -d '{"type":"catalog", "privilege":"CATALOG_MANAGE_CONTENT"}';
        echo Done.;
